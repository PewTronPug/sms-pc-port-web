<!DOCTYPE html>
<html>
<head>
    <title>Mario Sunshine</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 40px; background: #333; color: white; }
        button { padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 5px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        canvas { margin-top: 20px; background: black; display: none; }
        #msg { margin: 20px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Mario Sunshine</h1>
    <input type="file" id="iso" accept=".iso,.gcm,.ciso">
    <button id="play" disabled>Play</button>
    <div id="msg"></div>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
        let data = null;
        const iso = document.getElementById('iso');
        const play = document.getElementById('play');
        const msg = document.getElementById('msg');
        const canvas = document.getElementById('canvas');

        iso.onchange = (e) => {
            const f = e.target.files[0];
            if (!f) return;
            msg.textContent = 'Loading...';
            const r = new FileReader();
            r.onload = () => {
                data = r.result;
                msg.textContent = 'Ready';
                play.disabled = false;
            };
            r.onerror = () => msg.textContent = 'Error';
            r.readAsArrayBuffer(f);
        };

        play.onclick = () => {
            if (!data) return;
            msg.textContent = 'Starting...';
            canvas.style.display = 'block';
            window.Module = { canvas: canvas };
            const s = document.createElement('script');
            s.src = 'sms.js';
            document.body.appendChild(s);
        };
    </script>
</body>
</html>
